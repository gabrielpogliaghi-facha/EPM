<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Sin conexión — EPM</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#1e1b4b,#312e81);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding:24px;
  }
  .card {
    background:#fff; border-radius:20px; padding:40px 28px; max-width:380px;
    width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .card img { width:88px; height:88px; object-fit:contain; margin-bottom:20px; }
  .card h1 { font-size:19px; font-weight:800; color:#1e1b4b; margin-bottom:10px; }
  .card p { font-size:14px; color:#64748b; line-height:1.6; margin-bottom:24px; }
  .card button {
    background:#6366f1; color:#fff; border:none; border-radius:10px;
    padding:12px 24px; font-size:14px; font-weight:700; cursor:pointer;
    width:100%;
  }
  .card button:hover { background:#4f46e5; }
  .icon-wifi { font-size:40px; margin-bottom:14px; }
  @media (prefers-color-scheme: dark) {
    .card { background:#1e293b; }
    .card h1 { color:#f1f5f9; }
    .card p  { color:#94a3b8; }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/logo-epm.jpg" alt="Logo EPM" onerror="this.style.display='none'" />
    <div class="icon-wifi">📡</div>
    <h1>Sin conexión</h1>
    <p>Conectate a internet para usar el sistema EPM. Cuando vuelva la señal, tocá el botón para reintentar.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
